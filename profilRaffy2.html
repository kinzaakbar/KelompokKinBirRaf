<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Anggota - Raffy Thafjani Rusdiansyah</title>
  <style>
  
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Kartu Profil */
    .profile-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      text-align: center;
      padding: 32px 24px;
    }

    /* Foto Profil Placeholder */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 4px solid #2b6cb0;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .role {
      font-size: 0.95rem;
      color: #4a5568;
      font-weight: 500;
      margin-bottom: 20px;
    }

    /* Informasi */
    .info-list {
      text-align: left;
      background-color: #edf2f7;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .info-item {
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .info-item strong {
      color: #2b6cb0;
    }

    /* About */
    .bio {
      font-size: 0.9rem;
      color: #718096;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* LINK */
    .btn-github {
      display: inline-block;
      background-color: #2d3748;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-github:hover {
      background-color: #1a202c;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- foto -->
    <img src="https://via.placeholder.com/150" alt="Foto Profil" class="avatar">
    
    <h1 class="name">Raffy Thafjani Rusdiansyah</h1>
    <p class="role">Anggota Kelompok / Developer</p>

    <div class="info-list">
      <div class="info-item">
        <strong>NIM:</strong> 2025081013
      </div>
      <div class="info-item">
        <strong>Program Studi:</strong> Sistem Informasi
      </div>
      <div class="info-item">
        <strong>Kelas:</strong> SIF A
      </div>
    </div>

    <p class="bio">
      Mahasiswa Sistem Informasi yang tertarik pada pengembangan web native dan sistem informasi terintegrasi.
    </p>

    <a href="https://github.com" target="_blank" class="btn-github">Lihat GitHub</a>
  </div>

</body>
</html>
